<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CoopCentric</title>
<meta name="viewport" content="width=1920, height=1080">
<script src="./lib/hcap.js"></script>
<script src="./lib/idcap.js"></script>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./zones.css">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"LG Display","LG Smart UI",Helvetica,Arial,sans-serif}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#0b1a2a;background-size:cover;background-position:center}
  #videohost{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;background:transparent;display:none}
  .urlvideo{position:absolute;left:0;top:0;width:100%;height:100%;background:transparent;object-fit:contain;display:block;visibility:hidden}
  .urlvideo[data-ready="1"]{visibility:visible;background:#000}
  #overlay{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
  .banner{position:absolute;left:80px;top:880px;box-sizing:border-box;padding:18px 36px;font-size:48px;line-height:1.1;background:rgba(0,0,0,.65);border-radius:14px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .banner.show{opacity:1}
  .digits{position:absolute;left:1560px;top:60px;box-sizing:border-box;padding:14px 30px;font-size:72px;font-weight:bold;text-align:right;background:rgba(0,0,0,.65);border-radius:14px;display:none}
  .digits.show{display:block}
  .message{position:absolute;left:0;right:0;bottom:0;padding:26px 80px;font-size:40px;background:rgba(200,30,30,.92);display:none}
  .message.show{display:block}
  .popup{position:absolute;left:210px;top:150px;box-sizing:border-box;padding:30px 60px;font-size:46px;line-height:1.25;text-align:center;background:rgba(10,20,40,.94);border:3px solid #ffd166;border-radius:20px;display:none;white-space:pre-wrap}
  .popup.show{display:block}
  #status{position:absolute;left:0;right:0;bottom:0;padding:6px 16px;font-size:20px;color:#9ab;background:rgba(0,0,0,.55);display:none;white-space:pre-wrap;max-height:300px;overflow:hidden}
  #status.show{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<div id="overlay"><div class="banner"></div><div class="digits"></div><div class="message"></div><div class="popup"></div></div>
<div id="status"></div>
<script src="./app.js"></script><!-- build.mjs rewrites this to the content-hashed bundle -->
</body>
</html>
