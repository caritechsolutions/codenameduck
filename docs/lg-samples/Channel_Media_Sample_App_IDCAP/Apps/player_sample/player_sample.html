function log(msg) {

    var dateNow = new Date();

    var hours = dateNow.getHours();
    var minutes = dateNow.getMinutes();
    var seconds = dateNow.getSeconds();

    if (hours < 10) {
        hours = "0" + hours;
    }
    if (minutes < 10) {
        minutes = "0" + minutes;
    }
    if (seconds < 10) {
        seconds = "0" + seconds;
    }

    var content = hours + ":" + minutes + ":" + seconds + "->" + msg + "<br>" + document.getElementById("logMessage").innerHTML;

    document.getElementById("logMessage").innerHTML = content;
}

//Do each demo item on the app.
function select(option)
{
    switch (option) {
        case 1:
        if(current_pipeline)//Media playing previously
            {
                current_pipeline = 0;
                shutDown();
		        setTimeout(playIPChannel,500,"239.1.1.1", 8208); //It needs some time to play next video after hcap.Media.shutDown
            }
            else
            {
                playIPChannel("239.1.1.1", 8208);
            }
            break;
        case 2:
        if(current_pipeline)
        {
            current_pipeline = 0;
            shutDown();
            setTimeout(playIPChannel,500,"239.1.1.2", 8208);
        }
        else
        {
            playIPChannel("239.1.1.2", 8208);
        }
        break;
        case 3:
            if(current_pipeline)          
            {
                playMedia("http://192.168.0.5:8080/procentric/application/sample/AOA_Dance_Practice.mp4", 'video/mp4');       //playMedia() doesn't have hcap.Media.startUp.
            }
            else
            {
                current_pipeline = 1;
                playVOD("http://192.168.0.5:8080/procentric/application/sample/AOA_Dance_Practice.mp4", 'video/mp4');          //playVOD() havs hcap.Media.startUp.
            }
            break;
        case 4:
            if(current_pipeline)
            {
                playMedia("http://192.168.0.5:8080/procentric/application/sample/video-auto-rotate.mp4"); 
            }
            else
            {
                current_pipeline = 1;
                playVOD("http://192.168.0.5:8080/procentric/application/sample/video-auto-rotate.mp4");
            }
            break;
        case 5:
            if(current_pipeline)
            {
                playMedia("https://anyHLS_url_available_ontheinternet.m3u8", 
                'application/x-mpegURL');
            }
            else
            {
                current_pipeline = 1;
                playVOD("https://anyHLS_url_available_ontheinternet.m3u8",
                'application/x-mpegURL');
            }
            break;
    }
}

document.addEventListener("keydown",

            case idcap.key.Code.NUM_1:// Remote controller 1
                select(1);
                break;
            case idcap.key.Code.NUM_2:// Remote controller 2
                select(2);
            break;
            case idcap.key.Code.NUM_3:// Remote controller 3
                select(3);
            break;
            case idcap.key.Code.NUM_4:// Remote controller 4

                break;
            case idcap.key.Code.NUM_5:// Remote controller 5
                select(5);
                break;
            case idcap.key.Code.STOP:// Remote controller Stop
                stopMedia();
                break;
            case idcap.key.Code.GREEN:// Remote controller green

            case idcap.key.Code.RED:// Remote controller Red

//1.stop , 2.destroy , 3.shutDown
function shutDown() {
    idcap.request( "idcap://tv/media/control" , {
        "parameters": {
            "command":"stop",
        },
        "onSuccess" : function(s) {
            console.log("onSuccess");
            idcap.request( "idcap://tv/media/destroy" , {
                "onSuccess" : function(s) {
                    console.log("onSuccess");
                    idcap.request( "idcap://tv/media/shutdown" , {
                        "onSuccess" : function(s) {
                            log("shutDown onSuccess");
                            _media_status = 0; //stop
                        }, 
                        "onFailure" : function(f) {
                            console.log("onFailure : errorMessage = " + f.errorMessage);
                        }
                    });
                }, 
                "onFailure" : function(f) {
                    console.log("onFailure : errorMessage = " + f.errorMessage);
                }
            });  
        },
        "onFailure" : function(f) {
            console.log("onFailure : errorMessage = " + f.errorMessage);
        }
});	
}

//1._media.stop , 2._media.destroy , 3.hcap.Media.createMedia, 4._media.play
function playMedia(srcVideo, mimeType) {
    if(!mimeType) mimeType = "video/mp4";
    idcap.request( "idcap://tv/media/control" , {
        "parameters": {
            "command":"stop",
        },
                "onSuccess" : function() {
                    console.log("onSuccess");
                    idcap.request( "idcap://tv/media/destroy" , {
                        "onSuccess" : function() {
                            console.log("onSuccess");
                            idcap.request( "idcap://tv/media/create" , {
                                "parameters": {
                                    "url" : srcVideo,
                                    "mimeType" : mimeType
                                },
                                onSuccess: function (s) {
                                    log("[2] Create Media success");
                                    hideShow("createMediaSuccess", "inline");
                                    log(src);
                                },
                                onFailure: function (f) {
                                    log("Error : " + f.errorMessage);
                                    hideShow("createMediaFail", "inline");
                                },
                            });

                            idcap.request( "idcap://tv/media/control" , {
                                "parameters": {
                                    "command":"play",
                                    "repeatCount" : 0,
                                },
                                "onSuccess": function () {
                                    log("onSuccess : playVOD -> " + srcVideo);
                                    _media_status = 1; //play
                                    
                                },
                                "onFailure": function (f) {
                                    log("onFailure : errorMessage = " + f.errorMessage);
                                }
                            });
                        }, 
                        "onFailure" : function(f) {
                            console.log("onFailure : errorMessage = " + f.errorMessage);
                        }
                    });  
                },
                "onFailure" : function(f) {
                    console.log("onFailure : errorMessage = " + f.errorMessage);
                }
        });

    
}

//1.hcap.Media.startUp , 2.hcap.Media.createMedia , 3._media.play
function playVOD(srcVideo, mimeType) {
    if(!mimeType) mimeType = "video/mp4";
    idcap.request( "idcap://tv/media/startup" , {
        "parameters": {
        },
        "onSuccess": function () {
            log("onSuccess : startUp");
            idcap.request( "idcap://tv/media/create" , {
                "parameters": {
                    "url" : srcVideo,
                    "mimeType" : mimeType
                },
                onSuccess: function (s) {
                    log("[2] Create Media success");
                    log(src);
                },
                onFailure: function (f) {
                    log("Error : " + f.errorMessage);
                },
            });

            idcap.request( "idcap://tv/media/control" , {
                "parameters": {
                    "command":"play",
                    "repeatCount" : 0,
                },
                "onSuccess": function () {
                    log("onSuccess : playVOD -> " + srcVideo);
                    _media_status = 1; //play
                    
                },
                "onFailure": function (f) {
                    log("onFailure : errorMessage = " + f.errorMessage);
                }
            });
        },
        "onFailure": function (f) {
            log("onFailure : errorMessage = " + f.errorMessage);
        }
    });
}

//Pause-Resume of Media played
var pr = 1;
function pause_resume(){
    if(pr){
        pr = 0;
        idcap.request( "idcap://tv/media/control" , {
            "parameters": {
                "command":"pause",
            },
            "onSuccess" : function() {
                console.log("onSuccess");
            },
            "onFailure" : function(f) {
                console.log("onFailure : errorMessage = " + f.errorMessage);
            }
        });
    }
    else
    {
        pr = 1;
        idcap.request( "idcap://tv/media/control" , {
            "parameters": {
                "command":"resume",
            },
            "onSuccess" : function() {
                console.log("onSuccess");
            },
            "onFailure" : function(f) {
                console.log("onFailure : errorMessage = " + f.errorMessage);
            }
        });
    }
   
}

//Rewind of Media played
function Rewind(){
    idcap.request( "idcap://tv/media/playposition/get" , {
        "parameters": {},
        "onSuccess" : function(s) {
            log("onSuccess position : " + s.positionInMs);
            var current = s.positionInMs;
            idcap.request( "idcap://tv/media/information/get" , {
                "parameters": {},
                "onSuccess" : function(s) {
                    log("onSuccess" +
                        "\nvideoAvailable = " + s.videoAvailable +
                        "\ntitle = " + s.title +
                        "\ncontentLengthInMs = " + s.contentLengthInMs);
                    idcap.request( "idcap://tv/media/playposition/set" , {
                        "parameters": {
                            "positionInMs" : current - (s.contentLengthInMs / 10),
                        },
                    "onSuccess" : function() {
                        log("positionInMs=" + (current - (s.contentLengthInMs / 10)));
                    },
                    "onFailure" : function(f) {
                        log("onFailure : errorMessage = " + f.errorMessage);
                    }
                });    
                },
                "onFailure" : function(f) {
                    log("onFailure : errorMessage = " + f.errorMessage);
                }
            });
        },
        "onFailure" : function(f) {
            log("onFailure : errorMessage = " + f.errorMessage);
        }
    });
}

//Fast Forward of Media played

    idcap.request( "idcap://tv/media/playposition/get" , {

        "onSuccess" : function(s) {
            log("onSuccess position : " + s.positionInMs);
            var current = s.positionInMs;
            idcap.request( "idcap://tv/media/information/get" , {
                "parameters": {
                },
                "onSuccess" : function(s) {
                    log("onSuccess" +
                        "\nvideoAvailable = " + s.videoAvailable +
                        "\ntitle = " + s.title +

                    idcap.request( "idcap://tv/media/playposition/set" , {
                    "parameters": {
                        "positionInMs" : current + (s.contentLengthInMs / 10),
                    },
                    "onSuccess" : function() {

                }
            });
        },
        "onFailure" : function(f) {
            log("onFailure : errorMessage = " + f.errorMessage);
        }
    });
}
