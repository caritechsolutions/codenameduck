<!DOCTYPE html>
<html>
<head>
    <title>Sample App</title>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./js/hcap.js"></script>    
    <script src = "./js/main.js"></script>
    <script src = "./js/key.js"></script>

    <style>
        body{
            background-color: white;
        }
        #logoImg{
            position: absolute;
            left: 1vw;
            top: 1vh;
            width: 20vw;
        }
        #log_area{
            font-size: 12px;
            position: absolute;
            right: 0px;
            top: 0px;
            width: 25vw;
            padding: 10px;
            height: 100%;
            background-color: #dbdad7;
        }
        #mainContainer{
            position:absolute;
            left: 1vw;
            top: 10vh;
            width: 72vw;
            height: 80vh;
            background-color: rgb(255,243,205);
            padding: 20px;
            margin: 20px;
            border-radius: 20px;
        }
        #title{
            font-size: 40px;
        }
        #menuInfo{
            font-size: 14px;
        }
        #subContainer{
            font-size: 40px;
            background-color: rgb(255,217,102);
            border-radius: 5px;
            padding:10px;
            margin:10px;
            border-radius: 30px;
        }
    </style>
</head>

<body onload="run()">
    <img id = "logoImg" src = "content/logo.png">
    <div id = "mainContainer">
        <p id = "title">Press Remote controller's NUMBER button</p>
        <div id = "subContainer">
            <div>
                <p>[1] Set the volume level to 50
                    <!-- Success -->
                    <svg id = "setVolumeSuccess" style = "display: none"; width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-check-circle-fill" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                    </svg>
                    <!-- Fail -->
                    <svg id = "setVolumeFail" style = "display: none"; width ="1em" height="1em" viewBox="0 0 16 16" class="bi bi-x-circle-fill" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
                    </svg>
            </div>
            <div>
                <p>[2] Get network information
                    <!-- Success -->
                    <svg id = "getNetworkInfoSuccess" style = "display: none"; width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-check-circle-fill" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                    </svg>
                    <!-- Fail -->
                    <svg id = "getNetworkInfoFail" style = "display: none"; width ="1em" height="1em" viewBox="0 0 16 16" class="bi bi-x-circle-fill" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
                    </svg>
            </div>
            <div>
                <p>[5] Num 1 key attribute toggle
            </div>
            <div>
                <p>[6] Num 2 key attribute toggle
            </div>
            
        </div>
    </div>
    <p id = "log_area"></p>
</body>
</html>
