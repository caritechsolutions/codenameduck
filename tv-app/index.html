<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CoopCentric</title>
<meta name="viewport" content="width=1920, height=1080">
<script src="./lib/hcap.js"></script>
<script src="./lib/idcap.js"></script>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"LG Display","LG Smart UI",Helvetica,Arial,sans-serif}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#0b1a2a;background-size:cover;background-position:center}
  .zone{position:absolute;overflow:hidden;box-sizing:border-box;white-space:pre-wrap;line-height:1.15}
  .zone img{width:100%;height:100%;object-fit:contain;display:block}
  #status{position:absolute;left:0;right:0;bottom:0;padding:6px 16px;font-size:20px;color:#9ab;background:rgba(0,0,0,.55);display:none;white-space:pre-wrap;max-height:300px;overflow:hidden}
  #status.show{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<div id="status"></div>
<script src="./app.js"></script>
</body>
</html>
